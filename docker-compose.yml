services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fiscal_agent_db
    environment:
      POSTGRES_USER: fiscal_user
      POSTGRES_PASSWORD: fiscal_pass
      POSTGRES_DB: fiscal_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiscal_user -d fiscal_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
